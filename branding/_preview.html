<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;font-family:"Helvetica Neue",Arial,sans-serif;background:#0f0f12;color:#eee;}
 .row{display:flex;gap:24px;flex-wrap:wrap;align-items:center;padding:26px 32px;border-bottom:1px solid #222;}
 .row h3{width:100%;margin:0 0 6px;font-size:13px;color:#8a8a94;letter-spacing:.06em;text-transform:uppercase;}
 .chk{background-image:linear-gradient(45deg,#2a2a2a 25%,transparent 25%),linear-gradient(-45deg,#2a2a2a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2a2a2a 75%),linear-gradient(-45deg,transparent 75%,#2a2a2a 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;}
 .light{background:#f2f1ee;}
 .dark{background:#101014;}
 .box{padding:18px;border-radius:14px;}
 .bar{display:flex;align-items:center;height:26px;background:#e9e9ec;border-radius:6px;padding:0 10px;gap:8px;color:#333;font-size:12px;}
 img{display:block;}
</style></head><body>
 <div class="row"><h3>App icon (1024) · fiel à opção 04</h3>
   <img src="app-icon-1024.png" width="180">
   <img src="app-icon-1024.png" width="96">
   <img src="app-icon-1024.png" width="48">
   <img src="app-icon-1024.png" width="32">
 </div>
 <div class="row"><h3>Equalizador isolado, sem moldura (transparente)</h3>
   <div class="box chk"><img src="equalizador-branco-1024.png" width="120"></div>
   <div class="box dark"><img src="equalizador-branco-1024.png" width="120"></div>
   <div class="box light"><img src="equalizador-preto-1024.png" width="120"></div>
 </div>
 <div class="row"><h3>Menu bar (template preto, tamanho real na barra)</h3>
   <div class="bar"><img src="menubar-Template.png" width="22" height="22"><span>dita aí na barra do topo</span></div>
   <div class="box chk"><img src="menubar-Template@2x.png" width="44"></div>
 </div>
 <div class="row light"><h3 style="color:#555">Lockup (ícone + nome) — versão preta em fundo claro</h3>
   <img src="lockup-preto.png" width="420">
 </div>
 <div class="row"><h3>Lockup — versão branca em fundo escuro</h3>
   <img src="lockup-branco.png" width="420">
 </div>
</body></html>
