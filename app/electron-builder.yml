appId: com.felipetambara.dita-ai
productName: Dita AI
asar: false
afterPack: scripts/after-pack.cjs
directories:
  output: dist
files:
  - out/**
extraResources:
  - from: ../helper/dita-hotkeys
    to: dita-hotkeys
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - dir
  extendInfo:
    CFBundleDisplayName: Dita Aí
    NSMicrophoneUsageDescription: O Dita Aí usa o microfone para transcrever sua fala.
    LSUIElement: false
  hardenedRuntime: false
